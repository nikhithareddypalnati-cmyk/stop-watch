<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stopwatch-card">

        <div class="icon">⏱</div>

        <h1>STOPWATCH</h1>
        <p class="subtitle">Precision Timer</p>

        <div class="timer" id="display">00:00:00.00</div>

        <div class="buttons">
            <button id="start" class="start">▶ Start</button>
            <button id="pause" class="pause">Ⅱ Pause</button>
            <button id="reset" class="reset">↻ Reset</button>
            <button id="lap" class="lap">⚑ Lap</button>
        </div>

        <div class="lap-section">
            <div class="lap-title">
                <span>Lap Times</span>
                <span id="lapCount">0 Laps</span>
            </div>

            <div id="laps" class="laps">
                <p class="empty">No lap times yet</p>
            </div>
        </div>

    </div>

    <footer>
        Stopwatch Web Application
    </footer>

    <script src="script.js"></script>

</body>
</html>
